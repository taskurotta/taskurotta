global
    # ---------- 3.x: явно задаём лимиты памяти и файловых дескрипторов
    maxconn 2000
    # (опционально) ограничиваем потребление OpenSSL, если будете добавлять TLS
    # maxsslconn 1000

    # ---------- 3.x: по умолчанию включён multi-threading, если ядро ≥2.0
    # ничего дополнительно писать не надо, но можно ограничить потоки:
    # nbthread 4

defaults
    mode http

    # ---------- keep-alive теперь режим по умолчанию, строку можно убрать
    # option http-keep-alive          ← закомментировали – не нужна
    # http-reuse always               ← закомментировали – не нужна

    # ---------- старые таймауты оставляем
    timeout connect 5s
    timeout client  80s
    timeout server  80s

    # ---------- 3.x: добавляем «защитные» таймауты, которых не было в 1.6
    timeout http-request     10s     # защита от slowloris
    timeout http-keep-alive   2s     # сколько висит пустое соединение
    timeout check            200ms   # у вас уже было

    # ---------- логи (если нужны)
    # log global

resolvers docker
    nameserver dnsmasq 127.0.0.1:53
    hold valid 1s

frontend tsk_http
    bind *:80
    mode http

    # ---------- статистика (без изменений)
    stats enable
    stats uri /stats

    default_backend servers

backend servers
    balance leastconn

    # ---------- устаревшая опция 1.5-1.6, в 3.2 бесполезна
    # option http-pretend-keepalive   ← закомментировали / убираем

    server tsk_node1 tsk_node1:8811 \
        resolvers docker \
        resolve-prefer ipv4 \
        check inter 2s